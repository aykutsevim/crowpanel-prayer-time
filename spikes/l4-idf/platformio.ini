; L4 spike (spec 001, research R8, stack decision log 2026-11-23). Throwaway firmware, not the product.
;
; Question it answers: with plain ESP-IDF and the build options the precompiled Arduino libraries
; fix (RGB ISR IRAM-safe, XIP from PSRAM, 64-byte data cache line), does the RGB panel stay steady
; while Wi-Fi scans, flash writes and HTTPS run? Only if the owner says yes is the platform layer
; ported to ESP-IDF.
;
; Pins: espressif32 8.0.0 selects framework-espidf ~4.50505.0 (ESP-IDF 5.5.5); pinned exactly here.

[platformio]
boards_dir = boards

[env:spike]
platform = espressif32@8.0.0
platform_packages =
    platformio/framework-espidf@4.50505.0
board = crowpanel7_advance_idf
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
