; Namaz Vakti Panel — PlatformIO project
;
; Environments
;   crowpanel7_advance  Elecrow CrowPanel Advance 7.0", DIS02170A rev V1.4,
;                       ESP32-S3-WROOM-1-N16R8 (owner decision 2026-11-20, constitution 1.1.0)
;   native              host unit tests for lib/core, lib/providers and the pure silence gate
;   sim                 host UI harness: renders the engineering screens to out/snapshots/*.png
;   engine_table        host program: prints the prayer-time engine's output table (spec 002)
;
; The basic board (DIS08070H, env crowpanel7_basic) was removed in Slice 1: the owner has no
; basic board (specs/001-silent-board-bringup/plan.md, Structure decision). Git history keeps it.
;
; Platform pin (docs/decisions/0001-platform.md, docs/decisions/0002-display-stack.md, research R8
; and R9 of spec 001): espressif32 8.0.0 with plain ESP-IDF 5.5.5, framework-espidf pinned exactly.
; Arduino-ESP32 was used until 2026-11-23; its precompiled libraries fix build options the RGB panel
; needs under Wi-Fi load (stack decision log, L4). The ESP-IDF build options are in sdkconfig.defaults.

[platformio]
default_envs = crowpanel7_advance
boards_dir = boards

[env]
; Silence check (SIL-05, docs/specification/05-architecture.md §9) runs before every build,
; including `pio test`.
extra_scripts = pre:tools/pio_silence_check.py

[env:native]
platform = native@1.2.1
test_framework = unity
; LVGL and the UI library are not part of the host unit tests.
lib_ignore =
    nvp_ui
    lvgl
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    ; the pure command gate in src/platform/audio_off.h is tested on the host (SIL-02)
    -Isrc/platform

[env:sim]
platform = native@1.2.1
lib_deps =
    lvgl/lvgl@9.6.0
build_src_filter =
    -<*>
    +<../sim/diag_render/>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DNVP_SIM=1

[env:engine_table]
; Prints the prayer-time engine's output for the shared fixture (spec 002 FR-022).
; Build: pio run -e engine_table; run and compare: python tools/check_engine_table.py
; Expected output: specs/002-prayer-engine/contracts/engine-table.md
platform = native@1.2.1
build_src_filter =
    -<*>
    +<../sim/engine_table/>
lib_ignore =
    nvp_ui
    lvgl
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror

[env:crowpanel7_advance]
platform = espressif32@8.0.0
platform_packages =
    platformio/framework-espidf@4.50505.0
board = crowpanel7_advance
framework = espidf
board_build.partitions = partitions/crowpanel7_advance.csv
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.6.0
extra_scripts =
    pre:tools/pio_silence_check.py
    pre:tools/pio_lv_conf.py
    post:tools/pio_size_budget.py
build_flags =
    -Wall
    ; LV_CONF_PATH is set by tools/pio_lv_conf.py (ESP-IDF builds pass no -I flags to libraries).
    -Iinclude
    -DNVP_BOARD_NAME=\"crowpanel7_advance\"
