; Namaz Vakti Panel — PlatformIO project
;
; Environments
;   native            host unit tests for lib/core and lib/providers (no hardware)
;   crowpanel7_basic  Elecrow CrowPanel 7.0" basic, DIS08070H, ESP32-S3-WROOM-1-N4R8
;
; Platform pin (Slice 0, researched 2026-11-20, see docs/decisions/0001-platform.md):
;   official PlatformIO espressif32 8.0.0 = Arduino-ESP32 3.3.12 (based on ESP-IDF 5.5.5).
;   Same Arduino core line (3.x) as the vendor's PlatformIO example
;   (example/V3.0/PlatformIO70: pioarduino 55.03.38, Arduino 3.3.8). pioarduino 55.03.312-1
;   was tried first and failed to install with PlatformIO Core 6.2.0 on this machine.
;   Exact version, never a moving "stable" link (constitution, Principle V).

[platformio]
default_envs = crowpanel7_basic
boards_dir = boards

[env]
; Silence check (SIL-05, handover/docs/05-architecture.md §9) runs before every build,
; including `pio test`.
extra_scripts = pre:tools/pio_silence_check.py

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror

[env:crowpanel7_basic]
platform = espressif32@8.0.0
board = crowpanel7_basic
framework = arduino
board_build.partitions = partitions/crowpanel7_basic.csv
monitor_speed = 115200
extra_scripts =
    pre:tools/pio_silence_check.py
    post:tools/pio_size_budget.py
build_flags =
    -Wall
    -DNVP_BOARD_NAME=\"crowpanel7_basic\"
