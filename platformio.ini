; Namaz Vakti Panel — PlatformIO project
;
; Environments
;   crowpanel7_advance  Elecrow CrowPanel Advance 7.0", DIS02170A rev V1.4,
;                       ESP32-S3-WROOM-1-N16R8 (owner decision 2026-11-20, constitution 1.1.0)
;   native              host unit tests for lib/core, lib/providers and the pure silence gate
;   sim                 host UI harness: renders the engineering screens to out/snapshots/*.png
;
; The basic board (DIS08070H, env crowpanel7_basic) was removed in Slice 1: the owner has no
; basic board (specs/001-silent-board-bringup/plan.md, Structure decision). Git history keeps it.
;
; Platform pin (docs/decisions/0001-platform.md, research R9 of spec 001):
;   espressif32 8.0.0 = Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5). The platform only asks for
;   ~4.30312.0 of the Arduino package and several builds exist, so both framework packages are
;   pinned exactly via platform_packages (constitution, Principle V).

[platformio]
default_envs = crowpanel7_advance
boards_dir = boards

[env]
; Silence check (SIL-05, handover/docs/05-architecture.md §9) runs before every build,
; including `pio test`.
extra_scripts = pre:tools/pio_silence_check.py

[env:native]
platform = native@1.2.1
test_framework = unity
; LVGL and the UI library are not part of the host unit tests.
lib_ignore =
    nvp_ui
    lvgl
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    ; the pure command gate in src/platform/audio_off.h is tested on the host (SIL-02)
    -Isrc/platform

[env:sim]
platform = native@1.2.1
lib_deps =
    lvgl/lvgl@9.6.0
build_src_filter =
    -<*>
    +<../sim/diag_render/>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DNVP_SIM=1

[env:crowpanel7_advance]
platform = espressif32@8.0.0
platform_packages =
    platformio/framework-arduinoespressif32@4.30312.261116
    platformio/framework-arduinoespressif32-esp32s3-libs@3.3.12
board = crowpanel7_advance
framework = arduino
board_build.partitions = partitions/crowpanel7_advance.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.6.0
; Audio libraries shipped with the core; a stray include must fail the build (research R3.6).
lib_ignore =
    ESP_I2S
    ESP_SR
extra_scripts =
    pre:tools/pio_silence_check.py
    post:tools/pio_size_budget.py
build_flags =
    -Wall
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DNVP_BOARD_NAME=\"crowpanel7_advance\"
